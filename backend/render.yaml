services:
  - type: web
    name: priceradar-api
    region: singapore
    env: python
    plan: pro
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
      - key: LINE_MESSAGING_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_BOT_BASIC_ID
        sync: false
      - key: OPERATOR_LINE_USER_ID
        sync: false
