services:
  - type: web
    name: priceradar-api
    region: singapore
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && echo "YES" | python migrate.py && python seed.py
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
